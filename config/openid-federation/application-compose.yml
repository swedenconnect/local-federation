#
# Configuration of the OpenID Federation service in the local federation, active with the "compose" profile. See
# https://github.com/swedenconnect/openid-federation-services/blob/main/docs/service-configuration.md for the
# settings.
#
# The federation data (entities, trust anchor and intermediates, trust mark issuers and resolver) is read from the
# JSON files in this directory when the service starts. After a change, restart the service:
#
#   docker compose restart openid-federation
#
# The directories are given by the environment variables that docker-compose.yml sets:
#   APP_CONFIG_DIR    - this directory
#   COMMON_CONFIG_DIR - config/common
#
# TEST CREDENTIALS ONLY: the key stores are committed to the repository and the password is "secret".
#

spring:
  ssl:
    bundle:
      jks:
        tls:
          keystore:
            type: JKS
            location: file:${COMMON_CONFIG_DIR}/tls.jks
            password: secret
          key:
            alias: tls
            password: secret
        # The trust of the HTTP client that fetches entity configurations and subordinate statements, for example
        # those of the services that publish their own entity configurations.
        trust:
          truststore:
            type: JKS
            location: file:${COMMON_CONFIG_DIR}/trust.jks
            password: secret

server:
  port: 8443
  ssl:
    enabled: true
    bundle: tls

management:
  server:
    port: 8444
    ssl:
      enabled: true
      bundle: tls
  # No tracing collector runs in the local federation.
  tracing:
    enabled: false
    sampling:
      probability: 0.0
  otlp:
    metrics:
      export:
        enabled: false
    tracing:
      export:
        enabled: false

logging:
  structured:
    format:
      console:
  level:
    ROOT: INFO
    se.swedenconnect: INFO

#
# The federation keys. Each federation entity has a key of its own in federation-keys.jks (EC P-521). An entity
# signs with the first key of its "jwks", here "federation:<bundle name>".
#
credential:
  bundles:
    keystore:
      federation-keys:
        type: JKS
        location: file:${APP_CONFIG_DIR}/federation-keys.jks
        password: secret
    jks:
      trustanchor:
        name: "Local Federation Trust Anchor"
        store-reference: federation-keys
        key:
          alias: trustanchor
          key-password: secret
      tmi-loa:
        name: "Local Federation Level of Assurance Trust Mark Issuer"
        store-reference: federation-keys
        key:
          alias: tmi-loa
          key-password: secret
      tmi-contracts:
        name: "Local Federation Contracts Trust Mark Issuer"
        store-reference: federation-keys
        key:
          alias: tmi-contracts
          key-password: secret
      im-reg-sc:
        name: "Local Federation RP Registration Intermediate"
        store-reference: federation-keys
        key:
          alias: im-reg-sc
          key-password: secret
      im-reg-sc-op:
        name: "Local Federation OP Registration Intermediate"
        store-reference: federation-keys
        key:
          alias: im-reg-sc-op
          key-password: secret

federation:
