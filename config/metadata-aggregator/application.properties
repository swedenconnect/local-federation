#
# Configuration of the metadata aggregator of the local federation.
#
# The aggregator reads the entity metadata files in the metadata directory (see mdx.fd), and publishes them as one
# feed signed with the key in metadata-signing.jks. The certificate of that key is config/common/metadata-signing.crt.
#
# TEST CREDENTIALS ONLY: the key stores are committed to the repository and the password is "secret".
#

server.port=8443
server.servlet.context-path=/metadata

server.ssl.enabled=true
server.ssl.key-store=file:/opt/common/tls.jks
server.ssl.key-store-type=JKS
server.ssl.key-alias=tls
server.ssl.key-store-password=secret
server.ssl.key-password=secret

logging.level.se.swedenconnect.metadata.aggregator.daemon.DaemonTask=DEBUG

# Where mdx.fd is read from, and how often (in seconds) the metadata files are read again.
metadata-aggregator.aggregate-config-dir=/opt/aggregator
metadata-aggregator.recache-delay=60
metadata-aggregator.data-dir=/opt/aggregator
metadata-aggregator.cache-dir=/opt/aggregator/feed-cache

# The signing key of the feed. Note that "localtion" is the name the aggregator uses.
metadata-aggregator.key-source.type=jks
metadata-aggregator.key-source.localtion=${metadata-aggregator.data-dir}/metadata-signing.jks
metadata-aggregator.key-source.pass=secret
metadata-aggregator.key-source.alias=metadata
metadata-aggregator.key-source.cert-location=
metadata-aggregator.sign-algo=http://www.w3.org/2001/04/xmldsig-more#rsa-sha256
metadata-aggregator.validity-hours=168
# The cacheDuration of the feed. The services download the feed again before it has passed.
metadata-aggregator.cache-duration-minutes=10

# The AJP connector is off. The aggregator requires all three settings.
tomcat.ajp.enabled=false
tomcat.ajp.port=8009
tomcat.ajp.remoteauthentication=false
