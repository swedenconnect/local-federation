#
# The Sweden Connect local federation.
#
# All services are reached through the host name local.fed.swedenconnect.se, which must be mapped to 127.0.0.1 in the
# hosts file. The containers reach each other through the same name (extra_hosts with host-gateway), so that one TLS
# certificate, config/common/tls.jks, works everywhere. See docs/services.md for the ports and URLs.
#
# Variables are read from .env, see .env.example. Without a .env file the defaults below are used.
#
name: local-federation

networks:
  local-federation:
    name: local-federation

x-java-service: &java-service
  restart: on-failure
  networks:
    - local-federation
  extra_hosts:
    - "local.fed.swedenconnect.se:host-gateway"

services:

  #
  # Base services: ports 10900-10999
  #

  redis:
    image: redis/redis-stack:latest
    container_name: redis
    ports:
      - "10900:6379"
      - "10901:8001"
    networks:
      - local-federation
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-supersecret}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-supersecret}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  #
  # Applications: ports from 11000, in blocks of ten
  #

  metadata-aggregator:
    <<: *java-service
    image: ghcr.io/swedenconnect/metadata-aggregator:latest
    container_name: metadata-aggregator
    ports:
      - "11000:8443"
    volumes:
      - ./config/metadata-aggregator:/opt/aggregator
      - ./config/common:/opt/common:ro
    environment:
      SPRING_CONFIG_LOCATION: /opt/aggregator/
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/common/trust.jks -Djavax.net.ssl.trustStorePassword=secret -Djava.net.preferIPv4Stack=true -Dorg.apache.xml.security.ignoreLineBreaks=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8443/metadata/feed"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  reference-authn-server:
    <<: *java-service
    image: ${REFERENCE_AUTHN_SERVER_IMAGE:-ghcr.io/swedenconnect/sweden-connect-reference-authn-server:latest}
    container_name: reference-authn-server
    depends_on:
      metadata-aggregator:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "11010:8443"
      - "11011:8444"
    volumes:
      - ./config/reference-authn-server:/opt/reference-authn-server
      - ./config/common:/opt/common:ro
    environment:
      HOST_PORT: 11010
      APP_CONFIG_DIR: /opt/reference-authn-server
      COMMON_CONFIG_DIR: /opt/common
      REDIS_PASSWORD: "${REDIS_PASSWORD:-supersecret}"
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/reference-authn-server/
      SPRING_PROFILES_ACTIVE: compose
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/common/trust.jks -Djavax.net.ssl.trustStorePassword=secret"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8444/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  test-my-eid:
    <<: *java-service
    image: ${TEST_MY_EID_IMAGE:-ghcr.io/swedenconnect/test-my-eid:4.0.0}
    container_name: test-my-eid
    depends_on:
      metadata-aggregator:
        condition: service_healthy
    ports:
      - "11020:8443"
    volumes:
      - ./config/test-my-eid:/opt/test-my-eid
      - ./config/common:/opt/common:ro
    environment:
      HOST_PORT: 11020
      APP_CONFIG_DIR: /opt/test-my-eid
      COMMON_CONFIG_DIR: /opt/common
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/test-my-eid/
      SPRING_PROFILES_ACTIVE: compose
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/common/trust.jks -Djavax.net.ssl.trustStorePassword=secret"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8443/testmyeid/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  test-client:
    <<: *java-service
    image: ghcr.io/swedenconnect/sweden-connect-test-client:latest
    container_name: test-client
    depends_on:
      metadata-aggregator:
        condition: service_healthy
    ports:
      - "11030:8443"
    volumes:
      - ./config/test-client:/opt/test-client
      - ./config/common:/opt/common:ro
    environment:
      HOST_PORT: 11030
      APP_CONFIG_DIR: /opt/test-client
      COMMON_CONFIG_DIR: /opt/common
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/test-client/
      SPRING_PROFILES_ACTIVE: compose
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/common/trust.jks -Djavax.net.ssl.trustStorePassword=secret"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8443/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  openid-federation:
    <<: *java-service
    image: ${OPENID_FEDERATION_IMAGE:-ghcr.io/swedenconnect/openid-federation-services:latest}
    container_name: openid-federation
    ports:
      - "11040:8443"
      - "11041:8444"
    volumes:
      - ./config/openid-federation:/opt/openid-federation:ro
      - ./config/common:/opt/common:ro
    environment:
      APP_CONFIG_DIR: /opt/openid-federation
      COMMON_CONFIG_DIR: /opt/common
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/opt/openid-federation/
      SPRING_PROFILES_ACTIVE: compose
      TZ: "Europe/Stockholm"
      JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/opt/common/trust.jks -Djavax.net.ssl.trustStorePassword=secret"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://localhost:8444/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
